[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "awox-mesh-reconstruction"
version = "1.0.0"
description = "Unofficial Python library for controlling EGLO connect.z devices over Bluetooth via ESPHome proxies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
esphome = ["bleak-esphome", "habluetooth"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["awox*"]

[tool.setuptools.package-data]
awox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["python", "tests"]
